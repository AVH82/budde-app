name: Apply v252 cache keys

on:
  push:
    branches: [main]
    paths:
      - 'js/storage.google-drive.js'
      - '.github/workflows/apply-v252-cache-keys.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache-keys:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update script and Service Worker cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('js/storage.google-drive.js?v=pr251', 'js/storage.google-drive.js?v=pr252')
          text = text.replace('js/storage.google-drive.js"', 'js/storage.google-drive.js?v=pr252"')
          index.write_text(text)

          sw = Path('service-worker.js')
          text = sw.read_text()
          text = text.replace("budde-3-6-55-pr250", "budde-3-6-55-pr252")
          text = text.replace("budde-3-6-55-pr248", "budde-3-6-55-pr252")
          text = text.replace("CACHE_BUST_VERSION='pr250'", "CACHE_BUST_VERSION='pr252'")
          text = text.replace("CACHE_BUST_VERSION='pr248'", "CACHE_BUST_VERSION='pr252'")
          text = text.replace('storage.google-drive.js?v=pr250', 'storage.google-drive.js?v=pr252')
          text = text.replace('storage.google-drive.js?v=pr248', 'storage.google-drive.js?v=pr252')
          sw.write_text(text)
          PY
      - name: Commit cache-key update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'chore: publish Safari Drive fix with v252 cache keys'
          git push origin main
