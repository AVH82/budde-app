name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build deterministic Pages artifact
        shell: bash
        run: |
          DEPLOY_ID="${GITHUB_SHA::12}"
          CACHE_NAME="budde-3-6-55-${DEPLOY_ID}"

          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          sed -i -E "s#css/ast-012-4.css\?v=[^\"']+#css/ast-012-4.css?v=${DEPLOY_ID}#g" _site/index.html
          sed -i -E "s#css/designer-mode.css\?v=[^\"']+#css/designer-mode.css?v=${DEPLOY_ID}#g" _site/index.html
          sed -i -E "s#</head>#<link rel=\"stylesheet\" href=\"css/pwa-fullscreen-fix.css?v=${DEPLOY_ID}\" data-pwa-fullscreen=\"${DEPLOY_ID}\"></head>#" _site/index.html

          # Apply the iOS system chrome metadata directly to the deployed HTML.
          sed -i -E 's#<meta name="theme-color" content="[^"]+">#<meta name="theme-color" content="#000000">#' _site/index.html
          sed -i -E 's#<meta name="apple-mobile-web-app-status-bar-style" content="[^"]+">#<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">#' _site/index.html

          # Load the PR #274 startup fix directly from the deployed HTML instead of
          # relying on a Service Worker response rewrite that may not control the first load.
          if ! grep -q 'data-startup-layering="direct"' _site/index.html; then
            sed -i -E "s#(<script src=\"js/startup-gate.js[^\"]*\"></script>)#\1<script src=\"js/startup-sequence-layering-fix.js?v=${DEPLOY_ID}\" data-startup-layering=\"direct\"></script>#" _site/index.html
          fi

          sed -i -E "s/budde-3-6-55-pr[0-9]+/${CACHE_NAME}/g" _site/css/ast-012-4.css _site/css/pwa-fullscreen-fix.css
          sed -i -E "s/const CACHE_NAME='[^']+';/const CACHE_NAME='${CACHE_NAME}';/" _site/service-worker.js
          sed -i -E "s/const CACHE_BUST_VERSION='[^']+';/const CACHE_BUST_VERSION='${DEPLOY_ID}';/" _site/service-worker.js
          sed -i -E "s#css/pwa-fullscreen-fix.css\?v=[^\"']+#css/pwa-fullscreen-fix.css?v=${DEPLOY_ID}#g" _site/service-worker.js
          sed -i -E "s#css/ast-012-4.css\?v=[^\"']+#css/ast-012-4.css?v=${DEPLOY_ID}#g" _site/service-worker.js
          sed -i -E "s#js/startup-sequence-layering-fix.js\?v=[^\"']+#js/startup-sequence-layering-fix.js?v=${DEPLOY_ID}#g" _site/service-worker.js

          # Fail the build if the deployed artifact does not contain the direct script.
          grep -q 'data-startup-layering="direct"' _site/index.html
          grep -q 'apple-mobile-web-app-status-bar-style" content="black-translucent"' _site/index.html
          grep -q 'theme-color" content="#000000"' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
