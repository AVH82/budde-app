name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build deterministic Pages artifact
        shell: bash
        run: |
          DEPLOY_ID="${GITHUB_SHA::12}"
          CACHE_NAME="budde-3-6-55-${DEPLOY_ID}"

          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          sed -i -E "s#css/ast-012-4.css\?v=[^\"']+#css/ast-012-4.css?v=${DEPLOY_ID}#g" _site/index.html
          sed -i -E "s#css/designer-mode.css\?v=[^\"']+#css/designer-mode.css?v=${DEPLOY_ID}#g" _site/index.html
          sed -i -E "s#</head>#<link rel=\"stylesheet\" href=\"css/pwa-fullscreen-fix.css?v=${DEPLOY_ID}\" data-pwa-fullscreen=\"${DEPLOY_ID}\"></head>#" _site/index.html

          sed -i -E "s/budde-3-6-55-pr[0-9]+/${CACHE_NAME}/g" _site/css/ast-012-4.css _site/css/pwa-fullscreen-fix.css
          sed -i -E "s/const CACHE_NAME='[^']+';/const CACHE_NAME='${CACHE_NAME}';/" _site/service-worker.js
          sed -i -E "s/const CACHE_BUST_VERSION='[^']+';/const CACHE_BUST_VERSION='${DEPLOY_ID}';/" _site/service-worker.js
          sed -i -E "s#css/pwa-fullscreen-fix.css\?v=[^\"']+#css/pwa-fullscreen-fix.css?v=${DEPLOY_ID}#g" _site/service-worker.js
          sed -i -E "s#css/ast-012-4.css\?v=[^\"']+#css/ast-012-4.css?v=${DEPLOY_ID}#g" _site/service-worker.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
